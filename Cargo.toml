[package]
name = "clif-to-wasm"
version = "0.3.0"
edition = "2024"
# Cranelift 0.137 requires 1.97.
rust-version = "1.97"
description = "A WebAssembly backend for Cranelift IR"
readme = "README.md"
repository = "https://github.com/ryancbuckley/clif-to-wasm"
license = "Apache-2.0 WITH LLVM-exception"
keywords = ["cranelift", "wasm", "webassembly", "compiler", "jit"]
categories = ["compilers", "wasm"]

[package.metadata.docs.rs]
# Document `object_module` too, which needs the `module` feature.
all-features = true

[dependencies]
cranelift-codegen = { version = "0.137.1", default-features = false }
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher"] }
wasm-encoder = { version = "0.263", default-features = false }
cranelift-module = { version = "0.137.1", default-features = false, optional = true }

[features]
# `cranelift_module::Module` implementation emitting relocatable wasm objects.
# Cranelift's pulley backend, which this needs for a `TargetIsa`, does not
# build without `std` in 0.137 (fixed upstream; drop `std` when upgrading).
module = ["dep:cranelift-module", "cranelift-codegen/pulley", "cranelift-codegen/std"]

[dev-dependencies]
cranelift-frontend = "0.137.1"
cranelift-interpreter = "0.137.1"
cranelift-module = "0.137.1"
cranelift-reader = "0.137.1"
proptest = "1.12.0"
target-lexicon = "0.13.5"
wasmparser = "0.263"
wasmprinter = "0.263"
wasmtime = { version = "50.0.1", default-features = false, features = ["cranelift", "runtime", "std", "threads", "gc", "gc-drc"] }
wat = "1.263.0"

[[bench]]
name = "codegen"
harness = false

[[test]]
name = "object"
required-features = ["module"]
